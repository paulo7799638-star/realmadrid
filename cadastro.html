<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Madrid - Login de Madridista</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="logo-placeholder">REAL MADRID</div>
        <div class="subtitle">Área do Madridista</div>
        <form action="#">

            <div class="form-group">
                <label for="email">Nome de Usuário</label>
                <input type="name" id="email" placeholder="Seu nome " required>
            </div>

            <div class="form-group">
                <label for="email">E-mail ou Usuário</label>
                <input type="email" id="email" placeholder="Seu e-mail para cadastro" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="insira a senha" required>
            </div>
             <div class="form-group">
                <label for="password" >Confirmar Senha</label>
                <input type="password" id="password" placeholder="confirmar a senha" required>
            </div>

            <button type="submit" class="btn-login"><a href="index.html" style="text-decoration: none; color:cca300;">cadastrar</a></button>
        </form>

       

        <div class="hala-madrid">¡Hala Madrid y nada más!</div>
    </div>

</body>
</html>
